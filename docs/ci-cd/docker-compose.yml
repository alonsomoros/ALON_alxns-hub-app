services:
  alxns-persistence:
    build:
      context: ../..
      dockerfile: Dockerfile.persistence
    ports:
      # Solo loopback (REQ-023): la PWA llega por `tailscale serve` (127.0.0.1:8787), nunca por la LAN.
      - "127.0.0.1:8787:8787"
    environment:
      # 0.0.0.0 es el interior del contenedor; Docker lo reenvía solo al loopback del host.
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /app/data/alon-hub.sqlite
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS to the PWA origin}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://host.docker.internal:9090}
      DOCKER_PROXY_URL: http://docker-proxy:2375
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker-proxy
    volumes:
      - alxns-persistence-data:/app/data
    restart: unless-stopped

  # Proxy de solo lectura del socket de Docker (REQ-011): solo GET /containers, sin puertos publicados.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  alxns-persistence-data:
    name: alxns-persistence-data
